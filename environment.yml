name: buzzdetect-train
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
    - tensorflow>=2.16,<2.17  # tensorflow-metal 1.2.0 (latest on PyPI) only loads against this ABI
    - tensorflow-metal; sys_platform == "darwin"  # macOS GPU plugin; no Linux/Windows wheels exist
    - tensorflow[and-cuda]>=2.16,<2.17; sys_platform == "linux"  # bundles the CUDA/cuDNN wheels for NVIDIA GPU accel
    - protobuf>=3.20.3,<5  # perch-hoplite's gcloud deps pull protobuf 7, which breaks TF 2.16's generated code
    - librosa
    - soundfile
    - numpy<2
    - pandas
    - matplotlib
    - perch-hoplite
    - torch
    - torchaudio
    - torchlibrosa
    - transformers
