name: buzzdetect-train
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
    - tensorflow>=2.16,<2.17  # tensorflow-metal 1.2.0 (latest on PyPI) only loads against this ABI
    - tensorflow-metal
    - librosa
    - soundfile
    - numpy<2
    - pandas
    - matplotlib
    - perch-hoplite
    - torch
    - torchaudio
    - torchlibrosa
    - transformers
